services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chitu-data-protection:/keys
    restart: unless-stopped

volumes:
  chitu-data-protection:
